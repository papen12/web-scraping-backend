[package]
name = "scraper-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "_scraper_core"
crate-type = ["cdylib"]

[dependencies]
pyo3        = { version = "0.21", features = ["extension-module"] }
steel-core  = "0.8"              # spec pedía 0.6, mínima disponible es 0.8
scraper     = "0.19"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
regex       = "1"