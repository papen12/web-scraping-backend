# ── Índice de sitios inmobiliarios a scrapear ─────────────────────────────────
#
# Cada [[sitio]] define:
#   nombre  = identificador único (se usa como fuente en el esquema)
#   url     = URL de entrada al sitio
#   pais    = código ISO del país
#   activo  = true/false para activar/desactivar sin borrar
#   tags    = etiquetas para filtrar (ej: "portal", "inmobiliaria", "directorio")
#   notas   = observaciones libres

# ── Portales grandes ─────────────────────────────────────────────────────────

